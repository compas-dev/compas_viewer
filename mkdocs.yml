          - Arrows: examples/object/arrows.md
          - Buffer Geometry: examples/object/buffer_geometry.md
          - Breps: examples/object/brep.md
          - Frames: examples/object/frames.md
          - Geometries: examples/object/geometries.md
          - Lines: examples/object/lines.md
          - Mesh Display: examples/object/mesh_display.md
          - NURBS: examples/object/nurbs.md
          - Point Clouds: examples/object/pointcloud.md
          - Points: examples/object/points.md
          - Polylines: examples/object/polyline.md
