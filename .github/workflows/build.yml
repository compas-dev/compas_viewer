name: build

on:
  pull_request:
    branches: [main, c3-upgrade]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux EGL/OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
      - name: Install the reviewed COMPAS scene candidate
        run: uv pip install --python .venv --reinstall "compas @ git+https://github.com/compas-dev/compas.git@d43db206afec36450efbe76b53306ce3bd468076"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest

  distributions:
    needs: quality
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux EGL/OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: dev
          extras: ""
      - name: Build distributions outside the checkout
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/dist"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --out-dir "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/source"
      - name: Verify and install the exact wheel
        shell: bash
        run: |
          uv run python .github/verify_distributions.py "${RUNNER_TEMP}/dist"
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install \
            --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            "compas @ git+https://github.com/compas-dev/compas.git@d43db206afec36450efbe76b53306ce3bd468076"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" --no-deps "${RUNNER_TEMP}"/dist/*.whl
          "${RUNNER_TEMP}/wheel-env/bin/python" "${GITHUB_WORKSPACE}/.github/verify_plugin_discovery.py"
          uv pip install \
            --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            freetype-py Pillow PyOpenGL PySide6 pyright==1.1.414
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" -c "from compas_viewer import ANIMATION_PRESETS, AnimationPreset, CommandRegistry, Viewer, ViewerState"
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright \
            --pythonpath "${RUNNER_TEMP}/wheel-env/bin/python" \
            "${GITHUB_WORKSPACE}/tests/installed_typing_consumer.py"
