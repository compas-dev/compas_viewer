name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenGL system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/setup-python@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: docs
      - name: Build documentation
        run: invoke docs
