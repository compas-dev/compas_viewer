name: docs

on:
  pull_request:
    branches: [main, c3-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Linux EGL/OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: docs
          extras: ""
          strict: true
