name: release

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate

  validate:
    needs: detect
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux EGL/OpenGL runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          dependency-groups: dev
          extras: ""
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  docs-build:
    needs: detect
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Linux EGL/OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: docs
          extras: ""
          strict: true

  prepare:
    needs: [detect, validate]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux EGL/OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          dependency-groups: dev
          extras: ""
      - name: Build and verify distributions outside the checkout
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/source" "${RUNNER_TEMP}/dist"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/source"
          uv build --out-dir "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/source"
          uv run python .github/verify_distributions.py "${RUNNER_TEMP}/dist"
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install \
            --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            "compas @ git+https://github.com/compas-dev/compas.git@353cebfd21cd3623f7d950527d71f4770ff2a21c"
          uv pip install --python "${RUNNER_TEMP}/wheel-env/bin/python" --no-deps "${RUNNER_TEMP}"/dist/*.whl
          "${RUNNER_TEMP}/wheel-env/bin/python" "${GITHUB_WORKSPACE}/.github/verify_plugin_discovery.py"
          uv pip install \
            --python "${RUNNER_TEMP}/wheel-env/bin/python" \
            freetype-py Pillow PyOpenGL PySide6 pyright==1.1.414
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" -c "from compas_viewer import ANIMATION_PRESETS, AnimationPreset, CommandRegistry, Viewer, ViewerState"
          "${RUNNER_TEMP}/wheel-env/bin/python" -m pyright \
            --pythonpath "${RUNNER_TEMP}/wheel-env/bin/python" \
            "${GITHUB_WORKSPACE}/tests/installed_typing_consumer.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: [detect, docs-build, prepare]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/compas-viewer
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/dist

  github-release:
    needs: [detect, publish]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: compas-dev/compas-actions/github-release@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          github-token: ${{ github.token }}
          tag-name: ${{ needs.detect.outputs.tag }}
          target: ${{ github.sha }}
          release-name-prefix: COMPAS Viewer
          distribution-artifact-name: python-package-distributions

  docs:
    needs: [detect, github-release]
    if: needs.detect.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    permissions:
      contents: write
    steps:
      - name: Install Linux EGL/OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 python3-opengl
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          deploy: true
          version: ${{ needs.detect.outputs.version }}
          github-token: ${{ github.token }}
          python-version: "3.12"
          dependency-groups: docs
          extras: ""
          strict: true
