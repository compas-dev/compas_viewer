[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# project info
# ============================================================================

[project]
name = "compas_viewer"
description = "A standalone, high-performance 3D viewer for COMPAS."
keywords = ["architecture", "engineering", "visualization", "opengl", "qt"]
authors = [
    { name = "tom van mele", email = "tom.v.mele@gmail.com" },
    { name = "Li Chen", email = "li.chen@arch.ethz.ch" },
    { name = "Zac Zhuo Zhang", email = "zhuo.zhang@arch.ethz.ch" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "compas >=2.2.0",
    "freetype-py",
    "PyOpenGL",
    "Pillow",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "build",
    "bump-my-version",
    "compas_invocations2",
    "invoke >=0.14",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "wheel",
]
docs = [
    "compas_invocations2",
    "invoke >=0.14",
    "mkdocs >=1.6",
    "mkdocs-material >=9.5",
    "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://compas-dev.github.io/compas_viewer"
Documentation = "https://compas-dev.github.io/compas_viewer"
Repository = "https://github.com/compas-dev/compas_viewer.git"
Changelog = "https://github.com/compas-dev/compas_viewer/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_viewer/issues"
Forum = "https://forum.compas-framework.org/"

[project.entry-points."compas.plugins"]
compas_viewer = "compas_viewer.plugins"

# ============================================================================
# setuptools config
# ============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_viewer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compas_viewer = [
    "assets/fonts/*.ttf",
    "assets/icons/*.png",
    "assets/icons/*.svg",
    "renderer/shaders/*.frag",
    "renderer/shaders/*.geom",
    "renderer/shaders/*.vert",
]

# ============================================================================
# replace pytest.ini
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_viewer"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--doctest-glob=*.md", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# replace bumpversion.cfg
# ============================================================================

[tool.bumpversion]
current_version = "2.0.2"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_viewer/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# replace setup.cfg
# ============================================================================

[tool.black]
line-length = 179

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas", "compas_viewer"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
include = ["src/compas_viewer"]
pythonVersion = "3.12"
